# PROVIDED. Four servers, one group. Nobody wrote their operating system here, on purpose: Ansible will find out.
[fleet]
mf-u1 ansible_host=127.0.0.1 ansible_port=2231
mf-u2 ansible_host=127.0.0.1 ansible_port=2232
mf-d1 ansible_host=127.0.0.1 ansible_port=2233
mf-d2 ansible_host=127.0.0.1 ansible_port=2234

[fleet:vars]
ansible_user=deploy
ansible_ssh_private_key_file=keys/id_ed25519
ansible_ssh_common_args=-o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
ansible_python_interpreter=auto_silent
